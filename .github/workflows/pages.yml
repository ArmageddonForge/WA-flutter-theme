name: Deploy storybook to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true

      - name: Install dependencies
        working-directory: storybook
        run: flutter pub get

      - name: Build web
        working-directory: storybook
        run: flutter build web --release --base-href /WA-flutter-theme/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
