name: wa
description: >-
  Pixel-faithful Flutter widgets that recreate the 1999 Worms Armageddon
  frontend look and feel, scaled 2× for modern displays.
version: 0.1.0
repository: https://github.com/ArmageddonForge/WA-flutter-theme
homepage: https://github.com/ArmageddonForge/WA-flutter-theme
publish_to: 'none'

environment:
  sdk: '>=3.2.0-8.0.dev <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: DejaVuSansCondensed
      fonts:
        - asset: assets/fonts/DejaVuSansCondensed-Bold.ttf
          weight: 700
